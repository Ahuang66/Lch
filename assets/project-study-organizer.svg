<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="so-title so-desc">
  <title id="so-title">AI学习资料整理器界面示意</title>
  <desc id="so-desc">一个把学习资料整理成结构化复习内容的工具界面示意。</desc>
  <defs>
    <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1769d2"/><stop offset="100%" stop-color="#087b67"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(20,50,40,.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1440" height="900" fill="#f4f6f2"/>
  <rect width="1440" height="900" fill="url(#grid)"/>

  <g transform="translate(80,64)">
    <rect width="46" height="46" rx="12" fill="#15201d"/>
    <path d="M13 32 21 14h5l8 18h-6l-1.5-4h-6L19 32z" fill="#effaf6"/>
    <text x="62" y="22" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#15201d">AI实验室</text>
    <text x="62" y="40" font-family="Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#087b67">STUDY TOOL / 02</text>
  </g>

  <text x="80" y="212" font-family="Consolas,monospace" font-size="13" letter-spacing="3" fill="#087b67">LEARNING MATERIAL ORGANIZER</text>
  <text x="80" y="304" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="76" font-weight="800" fill="#15201d">AI学习资料整理器</text>
  <circle cx="1010" cy="284" r="9" fill="#1769d2"/>
  <text x="80" y="356" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#69756f">把杂乱资料，变成可以直接复习的知识结构。</text>

  <g>
    <rect x="80" y="416" width="608" height="412" rx="22" fill="#fff" stroke="rgba(24,45,38,.13)"/>
    <text x="114" y="466" font-family="Consolas,monospace" font-size="12" letter-spacing="2" fill="#087b67">01 / INPUT</text>
    <text x="114" y="504" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#15201d">粘贴学习资料</text>
    <rect x="114" y="536" width="540" height="252" rx="14" fill="#fbfcfa" stroke="rgba(24,45,38,.12)"/>
    <g fill="#dde4e0">
      <rect x="142" y="566" width="468" height="14" rx="7"/>
      <rect x="142" y="598" width="430" height="14" rx="7"/>
      <rect x="142" y="630" width="486" height="14" rx="7"/>
      <rect x="142" y="662" width="300" height="14" rx="7"/>
      <rect x="142" y="702" width="456" height="14" rx="7"/>
      <rect x="142" y="734" width="392" height="14" rx="7"/>
    </g>
  </g>

  <g>
    <rect x="752" y="416" width="608" height="412" rx="22" fill="#fff" stroke="rgba(24,45,38,.13)"/>
    <text x="786" y="466" font-family="Consolas,monospace" font-size="12" letter-spacing="2" fill="#1769d2">02 / OUTPUT</text>
    <text x="786" y="504" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#15201d">结构化学习结果</text>

    <rect x="786" y="536" width="540" height="128" rx="14" fill="#e7f0ff"/>
    <text x="812" y="572" font-family="Consolas,monospace" font-size="11" letter-spacing="1.8" fill="#1769d2">ONE - SENTENCE SUMMARY</text>
    <g fill="#9db8dd">
      <rect x="812" y="592" width="486" height="16" rx="8"/>
      <rect x="812" y="622" width="352" height="16" rx="8"/>
    </g>

    <g>
      <rect x="786" y="690" width="256" height="26" rx="9" fill="#e2f4ef"/>
      <rect x="1058" y="690" width="268" height="26" rx="9" fill="#e2f4ef"/>
      <rect x="786" y="732" width="540" height="14" rx="7" fill="#e6ebe8"/>
      <rect x="786" y="764" width="470" height="14" rx="7" fill="#e6ebe8"/>
      <rect x="786" y="796" width="300" height="14" rx="7" fill="#e6ebe8"/>
    </g>
  </g>
</svg>